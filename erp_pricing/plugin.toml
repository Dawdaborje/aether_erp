[plugin]
name = "erp_pricing"
icon_path = "assets/logo.svg"
label = "Pricing & taxes"
version = "0.1.0"
description = "Taxes, payment terms and price lists for buying and selling."
long_description = """
Tax rates (percent or fixed, tax-inclusive or exclusive), payment terms with due dates and early-payment
discounts, and buy/sell price lists with quantity breaks and validity windows. Procurement and selling call
`compute_line` and `price_for` so every document prices and taxes lines the same way. Written in Rust.
See docs/design.md in this plugin (erp_pricing/docs/design.md).
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["erp_item", "party"]
capabilities = ["db::query", "db::mutate", "import::run", "export::run", "storage::read", "storage::delete", "media::store"]
access_models = [
  { name = "tax", permissions = ["read", "write"] },
  { name = "tax_component", permissions = ["read", "write"] },
  { name = "payment_term", permissions = ["read", "write"] },
  { name = "price_list", permissions = ["read", "write"] },
  { name = "price_list_item", permissions = ["read", "write"] },
]
is_builtin = false
wasm_file = "out/plugin.wasm"

[[command]]
name = "seed"
function = "seed_pricing"
help = "Create starter payment terms and a default sell and buy price list (idempotent)"
on_install = true
on_upgrade = true

[media_guard]
function = "can_read_media"

[[roles]]
name = "pricing_admin"
label = "Pricing administrator"
description = "Maintains taxes, payment terms and price lists."

[[roles]]
name = "pricing_reader"
label = "Pricing reader"
description = "Reads taxes, terms and prices."

[app]
roles = ["pricing_reader", "pricing_admin"]
icon = "percent"
route = "/erp/pricing"
description = "Taxes, payment terms and price lists"
standalone = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "erp"
