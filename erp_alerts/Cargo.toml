[package]
name = "erp_alerts"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-sdk = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
